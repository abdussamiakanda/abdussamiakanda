<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#070a0b" />

    <!-- CSS layer order, declared before any stylesheet loads. MUI (Emotion)
         styles go in the "mui" layer, which must sit above Tailwind's base
         reset. Declaring it here keeps the order in production builds, where
         the CSS minifier would otherwise merge it away and leave "mui" last. -->
    <style>
      @layer theme, base, mui, components, utilities;
    </style>

    <!-- Apply the saved colour theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('masa-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <!-- Fonts load from the document, not via @import inside the bundled CSS,
         so the browser discovers them without waiting for that stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Noto+Serif+Bengali:wght@400..700&display=swap"
    />

    <!-- Per-page head. The build writes a copy of this file for every route
         with these tags filled in (scripts/generate-seo-files.mjs); in the
         browser the SEO component keeps them current. -->
    <!-- page-meta:start -->
    <title>Md Abdus Sami Akanda — Physicist &amp; full-stack developer</title>
    <meta name="description" content="Md Abdus Sami Akanda: physicist (MS, University of Nebraska–Lincoln) researching spintronics and magnetization dynamics, and full-stack developer building web platforms." />
    <link rel="canonical" href="https://abdussamiakanda.com/" />
    <meta property="og:image" content="https://abdussamiakanda.com/images/og-default.jpg" />
    <!-- page-meta:end -->
  </head>
  <body>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        This site needs JavaScript. You can still reach Md Abdus Sami Akanda at
        <a href="mailto:abdussamiakanda@gmail.com">abdussamiakanda@gmail.com</a> or read the
        <a href="/CV_Md_Abdus_Sami_Akanda.pdf">CV (PDF)</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
